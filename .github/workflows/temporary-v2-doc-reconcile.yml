name: Temporary Version 2 documentation reconciliation

on:
  pull_request:
    branches:
      - art-direction-and-first-assets
    paths:
      - ".github/workflows/temporary-v2-doc-reconcile.yml"

permissions:
  contents: write

concurrency:
  group: hollow-and-hoard-version-2-doc-reconcile
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out Version 2 branch
        uses: actions/checkout@v4
        with:
          ref: version-2-cynthia-feedback
          fetch-depth: 0

      - name: Reconcile canonical project records
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def insert_after_title(path, block):
              p = Path(path)
              text = p.read_text()
              if block.strip() in text:
                  return
              lines = text.splitlines()
              lines[1:1] = ["", block.strip(), ""]
              p.write_text("\n".join(lines) + "\n")

          insert_after_title(
              "docs/implementation-status.md",
              """## Current Version 2 authority\n\nVersion 2 is implemented, browser-tested, and hosted on the draft branch `version-2-cynthia-feedback`. Its current authoritative record is `docs/VERSION_2_IMPLEMENTATION_STATUS.md`.\n\nThe remainder of this file preserves the Version 1 implementation record. Statements below that describe Gargoyles as absent, the compact 384-by-256 atlas as current, or a preview as undeployed are historical Version 1 statements and do not govern Version 2.""",
          )

          insert_after_title(
              "docs/PROJECT_DEFINITION.md",
              """## Version 2 accepted extension\n\nCynthia's Version 1 testing proved the drag controls and general visual identity while identifying production-art blur, insufficient sound presence, missing Gargoyles, unclear story, and insufficient ambient life. Version 2 is therefore authorized and implemented with a separate introductory story screen, both creature families active from the start, distinct family relics, professional-resolution art, clearer gentle sound, fireflies and environmental animation, and persistent Hollow memory.\n\nWhere later historical sections say the Gargoyle family is reserved, multiple active families are a non-goal, or the compact provisional atlas is the current target, this Version 2 section supersedes them. Detailed authority is recorded in `docs/VERSION_2_CYNTHIA_FEEDBACK_PLAN.md` and `docs/VERSION_2_IMPLEMENTATION_STATUS.md`.""",
          )

          insert_after_title(
              "docs/VISUAL_DIRECTION.md",
              """## Version 2 production-art authority\n\nCynthia accepted the world as cute and pretty but rejected the first playable creature rendering as pixelated and insufficiently professional. Version 2 preserves the approved designs while replacing the compact prototype atlas with a 960-by-800 production atlas containing 160-by-160 creature crops, both Goblin and Gargoyle families, both relics, both dwellings, the Hoard, Codex, and story artwork.\n\nThe new source is displayed at more than twice large-iPhone piece resolution. Edge-connected matte removal preserves black eyes and internal shadows. The compact Version 1 atlas remains a continuity reference only. Future changes must refine these approved designs rather than regenerate unrelated substitutes.""",
          )

          kp = Path("docs/KNOWN_PROBLEMS_AND_PROVEN_SOLUTIONS.md")
          text = kp.read_text()
          marker = "## Incident entry template"
          entries = r'''### HAH-007 — Attractive concept art can still look unprofessional when the production source is too small

Status: `proven`

First observed: 2026-08-01

Affected area: creature rendering and production-asset pipeline

#### Symptoms

Cynthia described the Version 1 creatures as cute and pretty but pixelated, blurry, and unlike professional game art.

#### Cause

The approved designs were transported through a compact 384-by-256 atlas. Browser scaling enlarged small sprite crops beyond their useful source resolution.

#### Proven solution

Preserve the approved designs but rebuild the runtime carrier at a resolution appropriate to actual display. Version 2 uses a 960-by-800 atlas with 160-by-160 creature crops displayed at approximately 76 pixels on a large iPhone. The transport is split into bounded, hash-verified parts. Edge-connected near-black matte removal isolates the artwork while preserving black eyes and internal shadows.

#### Prevention rule

Visual approval and source-resolution approval are separate gates. Inspect art at actual rendered size and retain at least twice the intended display resolution for small game pieces.

#### Scope

Repository-wide for creature, relic, dwelling, and interface artwork.

### HAH-008 — Lore that exists only in documentation does not exist for the player

Status: `proven`

First observed: 2026-08-01

Affected area: story comprehension and Hoard meaning

#### Symptoms

Cynthia asked whether the game had a story and did not understand what the Hoard represented.

#### Cause

The design team understood the Hoard as the Hollow's permanent memory, but Version 1 placed only fragments of that idea inside Codex and Hoard copy after play had already begun.

#### Proven solution

Version 2 opens with a dedicated story and how-to-play screen. It explains that alike creatures remember what they can become, completed lineages leave relics, and the Hoard is what the Hollow remembers. The active board remains uncluttered.

#### Prevention rule

Core fiction must be encountered before the mechanic that depends on it. Move narrative orientation to a separate threshold screen instead of crowding the board.

#### Scope

Repository-wide for story, tutorial, Codex, Hoard, and progression communication.

### HAH-009 — Avoiding harsh sound can make feedback functionally absent

Status: `proven`

First observed: 2026-08-01

Affected area: audio feedback and atmosphere

#### Symptoms

Cynthia heard few sounds or found them too quiet to register, while still not wanting loud or sharp effects.

#### Cause

Version 1 overcorrected toward gentleness through low gain and sparse event coverage.

#### Proven solution

Version 2 keeps low, rounded synthesis but increases perceptual presence and covers pickup, relocation, rejection, both family merges, both spawners, Codex, Hoard, relic completion, and ambient night.

#### Prevention rule

Gentle is not synonymous with faint. Test audibility, attack, frequency content, event coverage, and comfort as separate qualities on the intended device.

#### Scope

Repository-wide for sound design and Cynthia acceptance.

### HAH-010 — A technically functional board can still make the world feel inert

Status: `proven`

First observed: 2026-08-01

Affected area: environmental animation and visual delight

#### Symptoms

The owner expected fireflies and more animation, while Cynthia's description made Version 1 sound visually plain.

#### Cause

The first gate prioritized stable mechanics and restrained static composition. Atmospheric motion from the original concept was reduced beyond the point where the Hollow felt alive.

#### Proven solution

Version 2 adds fireflies, lantern flicker, moon haze, atmospheric motes, idle creature movement, merge bloom, relic ceremony, and persistent environmental memory, with reduced-motion alternatives.

#### Prevention rule

Animation must reinforce habitation and consequence, not decorate every surface. Include at least one ambient, one creature, one interaction, and one progression response in each mature visual pass.

#### Scope

Repository-wide for motion and environmental feedback.

'''
          if "### HAH-007" not in text:
              text = text.replace(marker, entries + marker)
          text = text.replace(
              "The blank isolated Netlify project exists, but no deploy was created and no game was published.",
              "The package-based Netlify route remained invalid. Version 1 was later deployed through a separate encrypted relay, and Version 2 uses a verified GitHub Pages route. Do not retry the unavailable npm-package mechanism."
          )
          kp.write_text(text)
          PY

      - name: Remove temporary workflow and commit reconciled canon
        run: |
          set -euo pipefail
          rm -f .github/workflows/temporary-v2-doc-reconcile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reconcile project canon with Version 2"
          git push origin HEAD:version-2-cynthia-feedback
