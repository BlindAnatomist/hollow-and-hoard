name: Temporary Version 2 browser evidence gate

on:
  pull_request:
    branches:
      - art-direction-and-first-assets
    paths:
      - ".github/workflows/temporary-v2-browser-evidence.yml"
      - "index.html"
      - "src/**"
      - "tests/**"
      - "assets/production/v2/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write

concurrency:
  group: hollow-and-hoard-version-2-browser-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Version 2 exact-head browser evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact Version 2 branch
        uses: actions/checkout@v4
        with:
          ref: version-2-cynthia-feedback
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run rule, migration, and asset integrity tests
        run: npm test

      - name: Install transient Playwright tooling
        run: npm install --no-save --package-lock=false --ignore-scripts @playwright/test@1.61.1

      - name: Install bounded browser engines
        run: npx playwright install --with-deps chromium webkit

      - name: Start static server
        run: |
          python3 -m http.server 4173 > test-server-v2.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat test-server-v2.log
          exit 1

      - name: Run Version 2 browser and iPhone-sized smoke sequence
        env:
          SMOKE_BASE_URL: http://127.0.0.1:4173
        run: node tests/browser-smoke.mjs

      - name: Upload one-day visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: hollow-and-hoard-version-2-browser-smoke
          path: |
            test-output-v2
            test-output
            test-server-v2.log
          if-no-files-found: error
          retention-days: 1

      - name: Record passing exact-head gate and remove temporary workflows
        run: |
          set -euo pipefail
          mkdir -p docs
          cat > docs/VERSION_2_BROWSER_GATE_RESULT.md <<EOF
          # Version 2 Browser Gate Result

          Status: passed

          Workflow run: ${GITHUB_RUN_ID}

          Tested branch commit: ${GITHUB_SHA}

          Artifact: hollow-and-hoard-version-2-browser-smoke

          Completed checks:

          - rule, Version 1 migration, and production-atlas integrity tests;
          - desktop Chromium smoke sequence;
          - mobile WebKit smoke sequence at large-iPhone dimensions;
          - introductory story screen and Start Game transition;
          - Goblin and Gargoyle spawning, dragging, merging, and mismatched-drop recovery;
          - dual Codex and Hoard rendering;
          - Relic Blossom and Moonlit Relic completion;
          - firefly and environmental-memory state;
          - sound toggle, save, reload, Undo, and reset;
          - browser console and page-error monitoring.
          EOF
          rm -f .github/workflows/temporary-v2-browser-smoke.yml
          rm -f .github/workflows/temporary-v2-browser-evidence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record passing Version 2 browser gate"
          git push origin HEAD:version-2-cynthia-feedback
