name: Temporary Version 2 Pages preview

on:
  pull_request:
    branches:
      - art-direction-and-first-assets
    paths:
      - ".github/workflows/temporary-v2-pages-preview.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out Version 2 branch with history
        uses: actions/checkout@v4
        with:
          ref: version-2-cynthia-feedback
          fetch-depth: 0

      - name: Resolve passing browser commit and prove no runtime drift
        id: tested
        run: |
          set -euo pipefail
          tested_sha=$(awk -F': ' '/^Tested branch commit:/ {print $2}' docs/VERSION_2_BROWSER_GATE_RESULT.md | tr -d '[:space:]')
          if [[ ! "$tested_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Passing browser commit could not be resolved." >&2
            exit 1
          fi
          git cat-file -e "${tested_sha}^{commit}"
          git diff --exit-code "$tested_sha" HEAD -- \
            index.html \
            src \
            assets/production/v2 \
            package.json \
            package-lock.json \
            tests/browser-smoke.mjs \
            tests/gameLogic.test.js \
            tests/productionAssets.test.js
          echo "sha=${tested_sha}" >> "$GITHUB_OUTPUT"

      - name: Use Node 22 and rerun rule and asset checks
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run exact-runtime tests
        run: npm test

      - name: Stage exact runtime directory
        env:
          TESTED_SHA: ${{ steps.tested.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p preview-runtime-v2/assets/production/v2
          cp index.html preview-runtime-v2/
          cp -R src preview-runtime-v2/src
          cp assets/production/v2/production-atlas.json preview-runtime-v2/assets/production/v2/
          cp assets/production/v2/production-atlas.webp.base64.part-* preview-runtime-v2/assets/production/v2/
          printf '%s\n' "$TESTED_SHA" > preview-runtime-v2/PREVIEW_COMMIT.txt
          find preview-runtime-v2 -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/expected-hosted.sha256

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: preview-runtime-v2

      - name: Deploy Pages preview
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify every hosted runtime file
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/hosted-v2
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --location --max-time 30 "${PAGE_URL}index.html" > /dev/null; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              echo "Hosted preview did not become readable." >&2
              exit 1
            fi
            sleep 4
          done
          while IFS= read -r -d '' source; do
            relative=${source#preview-runtime-v2/}
            destination="/tmp/hosted-v2/${relative}"
            mkdir -p "$(dirname "$destination")"
            curl --fail --silent --show-error --location --retry 3 --max-time 30 \
              "${PAGE_URL}${relative}" -o "$destination"
          done < <(find preview-runtime-v2 -type f -print0)
          (cd /tmp/hosted-v2 && find . -type f -print0 | sort -z | xargs -0 sha256sum | sed 's#  \./#  preview-runtime-v2/#') > /tmp/actual-hosted.sha256
          diff -u /tmp/expected-hosted.sha256 /tmp/actual-hosted.sha256

      - name: Record verified hosted preview and remove temporary workflow
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          TESTED_SHA: ${{ steps.tested.outputs.sha }}
        run: |
          set -euo pipefail
          cat > docs/VERSION_2_HOSTED_PREVIEW_RESULT.md <<EOF
          # Version 2 Hosted Preview Result

          Status: passed

          Preview: ${PAGE_URL}

          Workflow run: ${GITHUB_RUN_ID}

          Browser-tested commit: ${TESTED_SHA}

          Deployment ID: ${{ steps.deployment.outputs.deployment_id }}

          Hosted-file SHA-256 verification: passed for every runtime file.

          Version 1 Netlify preview changed: no.
          EOF
          rm -f .github/workflows/temporary-v2-pages-preview.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record verified Version 2 hosted preview"
          git push origin HEAD:version-2-cynthia-feedback
