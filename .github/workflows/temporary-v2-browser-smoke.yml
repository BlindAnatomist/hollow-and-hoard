name: Temporary Version 2 browser smoke

on:
  pull_request:
    branches:
      - art-direction-and-first-assets
    paths:
      - ".github/workflows/temporary-v2-browser-smoke.yml"
      - "index.html"
      - "src/**"
      - "tests/**"
      - "assets/production/v2/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: hollow-and-hoard-version-2-browser-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Version 2 desktop and mobile browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact Version 2 branch
        uses: actions/checkout@v4
        with:
          ref: version-2-cynthia-feedback

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run rule, migration, and asset integrity tests
        run: npm test

      - name: Install transient Playwright tooling
        run: npm install --no-save --package-lock=false --ignore-scripts @playwright/test@1.61.1

      - name: Install bounded browser engines
        run: npx playwright install --with-deps chromium webkit

      - name: Start static server
        run: |
          python3 -m http.server 4173 > test-server-v2.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat test-server-v2.log
          exit 1

      - name: Run Version 2 browser and iPhone-sized smoke sequence
        env:
          SMOKE_BASE_URL: http://127.0.0.1:4173
        run: node tests/browser-smoke.mjs

      - name: Upload visual and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hollow-and-hoard-version-2-browser-smoke
          path: |
            test-output-v2
            test-output
            test-server-v2.log
          if-no-files-found: warn
          retention-days: 1
