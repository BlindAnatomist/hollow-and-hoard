name: Temporary verified Version 2 clean import

on:
  push:
    branches:
      - version-2-cynthia-feedback
    paths:
      - ".github/workflows/temporary-v2-import.yml"

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: hollow-and-hoard-v2-import
  cancel-in-progress: true

jobs:
  import:
    name: Reconstruct, verify, test, and commit Version 2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLEAN_PARENT: ad849f8ac06370d47b6a7e277047fc8b9df45e07
      TARGET_BRANCH: version-2-cynthia-feedback
      PR_NUMBER: "2"
      CHUNK_COUNT: "11"
      EXPECTED_BASE64_CHARS: "120820"
      EXPECTED_ZIP_BYTES: "90615"
      EXPECTED_ZIP_SHA256: ddeda96af4522078147bd84bff373fd96fa232885ecfcf099323dd2167e6e4da
      EXPECTED_CHUNK_09_SHA256: c648e4cec2d8ef2b11bf068ea0548bc8fd4b6b69bf774226fe9b3d947d482852

    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reset worktree to clean Version 2 plan
        run: git reset --hard "${CLEAN_PARENT}"

      - name: Receive and verify bounded import chunks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > /tmp/hollow-v2.b64
          for number in $(seq -w 1 "${CHUNK_COUNT}"); do
            prefix="V2_IMPORT_CHUNK_${number}_OF_${CHUNK_COUNT}"
            body=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
              --jq "[.[] | select(.body | startswith(\"${prefix}\\n\"))] | last | .body // \"\"" 2>/dev/null || true)
            if [[ -z "${body}" ]]; then
              echo "Missing ${prefix}." >&2
              exit 1
            fi

            payload_path="/tmp/chunk-${number}.txt"
            printf '%s\n' "${body}" | tail -n +2 | tr -d '\r\n' > "${payload_path}"
            actual_length=$(wc -c < "${payload_path}")
            expected_length=12000
            if [[ "${number}" == "11" ]]; then
              expected_length=820
            fi

            if [[ "${number}" == "09" && "${actual_length}" -eq 11999 ]]; then
              python3 - "${payload_path}" "${EXPECTED_CHUNK_09_SHA256}" <<'PY'
import hashlib
import pathlib
import sys

path = pathlib.Path(sys.argv[1])
expected = sys.argv[2]
data = path.read_bytes()
alphabet = b"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/"
for position in range(len(data) + 1):
    prefix = data[:position]
    suffix = data[position:]
    for character in alphabet:
        candidate = prefix + bytes([character]) + suffix
        if hashlib.sha256(candidate).hexdigest() == expected:
            path.write_bytes(candidate)
            print(f"Repaired chunk 09 at character position {position} with a hash-verified Base64 character.")
            raise SystemExit(0)
raise SystemExit("No single-character repair matched the authoritative chunk SHA-256.")
PY
              actual_length=$(wc -c < "${payload_path}")
            fi

            echo "Chunk ${number}: ${actual_length} characters; expected ${expected_length}."
            test "${actual_length}" -eq "${expected_length}"
            cat "${payload_path}" >> /tmp/hollow-v2.b64
          done

          total_length=$(wc -c < /tmp/hollow-v2.b64)
          echo "Combined Base64: ${total_length} characters; expected ${EXPECTED_BASE64_CHARS}."
          test "${total_length}" -eq "${EXPECTED_BASE64_CHARS}"

      - name: Verify and extract exact package
        run: |
          set -euo pipefail
          base64 --decode /tmp/hollow-v2.b64 > /tmp/hollow-v2.zip
          test "$(wc -c < /tmp/hollow-v2.zip)" -eq "${EXPECTED_ZIP_BYTES}"
          echo "${EXPECTED_ZIP_SHA256}  /tmp/hollow-v2.zip" | sha256sum --check --strict
          mkdir -p /tmp/hollow-v2-package
          unzip -q /tmp/hollow-v2.zip -d /tmp/hollow-v2-package
          cp -R /tmp/hollow-v2-package/. .
          rm -f package-lock.json src/atlas.js src/relicSummary.js tests/assetIntegrity.test.js tests/relicSummary.test.js

      - name: Run Version 2 rule and asset integrity tests
        run: npm test

      - name: Commit one clean Version 2 implementation change
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build Version 2 from Cynthia feedback"
          git push --force origin "HEAD:${TARGET_BRANCH}"
