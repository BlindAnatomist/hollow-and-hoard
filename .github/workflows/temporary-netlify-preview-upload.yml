name: Temporary hosted preview verification

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/temporary-netlify-preview-upload.yml"

permissions:
  contents: read

concurrency:
  group: hollow-and-hoard-temporary-hosted-preview-verification
  cancel-in-progress: true

jobs:
  verify:
    name: Verify deployed runtime bytes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PREVIEW_URL: https://hollow-and-hoard-preview.netlify.app

    steps:
      - name: Download hosted runtime
        run: |
          set -euo pipefail
          mkdir -p hosted/assets/art-development/provisional hosted/src
          files=(
            PREVIEW_COMMIT.txt
            index.html
            src/app.js
            src/atlas.js
            src/audio.js
            src/gameLogic.js
            src/relicSummary.js
            src/storage.js
            src/styles.css
            assets/art-development/provisional/atlas-map.json
            assets/art-development/provisional/first-playable-atlas.webp.base64.part-01
            assets/art-development/provisional/first-playable-atlas.webp.base64.part-02
            assets/art-development/provisional/first-playable-atlas.webp.base64.part-03
            assets/art-development/provisional/first-playable-atlas.webp.base64.part-04
          )
          for file in "${files[@]}"; do
            curl --fail --silent --show-error --location --retry 3 --max-time 30 \
              "${PREVIEW_URL}/${file}" -o "hosted/${file}"
          done

      - name: Verify exact tested bytes
        working-directory: hosted
        run: |
          cat > expected.sha256 <<'EOF'
          0337fb732ed0eb6a2cf74b99b3b43bbde8d5a4236f393b4e816557f51b0721e0  PREVIEW_COMMIT.txt
          724ea566410ddb6445f9307756e35355b201e7fd512ef394b5a22055aa6baa8b  assets/art-development/provisional/atlas-map.json
          23938ba3163567b1abd036b117c49cffd06cadb997962760c772bc98dea9a40c  assets/art-development/provisional/first-playable-atlas.webp.base64.part-01
          bd4214f848469d39eedbb815a2bafe6d8d5efa29c4f28f27f33dca379c47086c  assets/art-development/provisional/first-playable-atlas.webp.base64.part-02
          5fd4d70febd24417cc8f6fec11d314df68496619936e9f1821620b2c1398c8d5  assets/art-development/provisional/first-playable-atlas.webp.base64.part-03
          a49ce8b6f3bc6140615e216539e564139ef3882c7ad4803fa96ed50b6ab26c7b  assets/art-development/provisional/first-playable-atlas.webp.base64.part-04
          230da3c869ad05b235af39f40b59af059ea8436113d720dba8d0e17083ac823d  index.html
          ac0afc8e73da5c85ad06277614b34b1a6aa207ff809df8533d1a1373418c201a  src/app.js
          37cc3afaa0838b38f0de8ac2c3dc5abb4cf17890877480b288c52daa0271ea08  src/atlas.js
          8df3e80ae1c756dcfc343c8249f4d8be41ed9630100d3be6c415176b2460ae35  src/audio.js
          6392e1bf1dae6d901800e15eb38867cef6aded245283e71ed3cbd0670beabfdf  src/gameLogic.js
          a3396cec0d18374044322f8b2763052e2073278ee149c256b0e393c8c96c7e2e  src/relicSummary.js
          d9c20c901de360c2d2297a044ebcaa09094475f3ba1c371c0b9e7ba5496c6a92  src/storage.js
          832bada92d21a03f2faf23bd7a658431b39f220ea947e983b704d2dcba5f4a3c  src/styles.css
          EOF
          sed -i 's/^          //' expected.sha256
          sha256sum --check --strict expected.sha256

      - name: Verify hosted identity and entry point
        working-directory: hosted
        run: |
          test "$(cat PREVIEW_COMMIT.txt)" = "2bded6ebf4750d3fea405cc702b6b69c6e3d3438"
          grep -Fq '<title>Hollow &amp; Hoard</title>' index.html
          grep -Fq './src/app.js' index.html
          echo "Hosted preview exactly matches the browser-tested runtime artifact."
