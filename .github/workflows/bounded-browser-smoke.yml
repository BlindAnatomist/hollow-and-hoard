name: Bounded browser smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hollow-and-hoard-bounded-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Rules and browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run pure game rules
        run: npm test

      - name: Install transient Playwright test tooling
        run: npm install --no-save --package-lock=false --ignore-scripts @playwright/test@1.61.1

      - name: Install bounded browser engines
        run: npx playwright install --with-deps chromium webkit

      - name: Start static server
        run: |
          python3 -m http.server 4173 > test-server.log 2>&1 &
          echo $! > test-server.pid
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat test-server.log
          exit 1

      - name: Run browser and iPhone-sized smoke test
        env:
          SMOKE_BASE_URL: http://127.0.0.1:4173
        run: node tests/browser-smoke.mjs

      - name: Stage tested preview runtime
        run: |
          mkdir -p preview-runtime/assets/art-development/provisional
          cp index.html preview-runtime/
          cp -R src preview-runtime/src
          cp assets/art-development/provisional/atlas-map.json preview-runtime/assets/art-development/provisional/
          cp assets/art-development/provisional/first-playable-atlas.webp.base64.part-* preview-runtime/assets/art-development/provisional/
          printf '%s\n' "${GITHUB_SHA}" > preview-runtime/PREVIEW_COMMIT.txt

      - name: Upload tested preview runtime
        uses: actions/upload-artifact@v4
        with:
          name: hollow-and-hoard-tested-preview-runtime
          path: preview-runtime
          if-no-files-found: error
          retention-days: 1

      - name: Upload bounded smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hollow-and-hoard-browser-smoke
          path: |
            test-output/browser-smoke
            test-server.log
          if-no-files-found: warn
          retention-days: 1
