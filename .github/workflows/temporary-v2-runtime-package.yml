name: Temporary Version 2 tested runtime package

on:
  pull_request:
    branches:
      - art-direction-and-first-assets
    paths:
      - ".github/workflows/temporary-v2-runtime-package.yml"

permissions:
  contents: write

concurrency:
  group: hollow-and-hoard-version-2-runtime-package
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out Version 2 branch with history
        uses: actions/checkout@v4
        with:
          ref: version-2-cynthia-feedback
          fetch-depth: 0

      - name: Resolve passing browser commit
        id: tested
        run: |
          set -euo pipefail
          tested_sha=$(awk -F': ' '/^Tested branch commit:/ {print $2}' docs/VERSION_2_BROWSER_GATE_RESULT.md | tr -d '[:space:]')
          if [[ ! "$tested_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Passing browser commit could not be resolved." >&2
            exit 1
          fi
          git cat-file -e "${tested_sha}^{commit}"
          echo "sha=${tested_sha}" >> "$GITHUB_OUTPUT"

      - name: Prove runtime is unchanged since browser gate
        env:
          TESTED_SHA: ${{ steps.tested.outputs.sha }}
        run: |
          set -euo pipefail
          git diff --exit-code "$TESTED_SHA" HEAD -- \
            index.html \
            src \
            assets/production/v2 \
            package.json \
            package-lock.json \
            tests/browser-smoke.mjs \
            tests/gameLogic.test.js \
            tests/productionAssets.test.js

      - name: Use Node 22 and rerun cheap exact-runtime checks
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run rules and asset integrity
        run: npm test

      - name: Stage runtime-only directory
        env:
          TESTED_SHA: ${{ steps.tested.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p preview-runtime-v2/assets/production/v2
          cp index.html preview-runtime-v2/
          cp -R src preview-runtime-v2/src
          cp assets/production/v2/production-atlas.json preview-runtime-v2/assets/production/v2/
          cp assets/production/v2/production-atlas.webp.base64.part-* preview-runtime-v2/assets/production/v2/
          printf '%s\n' "$TESTED_SHA" > preview-runtime-v2/PREVIEW_COMMIT.txt

      - name: Upload exact tested Version 2 runtime
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: hollow-and-hoard-version-2-tested-runtime
          path: preview-runtime-v2
          if-no-files-found: error
          retention-days: 1

      - name: Record artifact and remove packager
        run: |
          set -euo pipefail
          cat > docs/VERSION_2_RUNTIME_ARTIFACT_RESULT.md <<EOF
          # Version 2 Runtime Artifact Result

          Status: passed

          Workflow run: ${GITHUB_RUN_ID}

          Tested browser commit: ${{ steps.tested.outputs.sha }}

          Artifact ID: ${{ steps.upload.outputs.artifact-id }}

          Artifact digest: ${{ steps.upload.outputs.artifact-digest }}

          Artifact name: hollow-and-hoard-version-2-tested-runtime

          Runtime drift check: passed

          Rule and production-asset integrity tests: passed
          EOF
          rm -f .github/workflows/temporary-v2-runtime-package.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record exact tested Version 2 runtime artifact"
          git push origin HEAD:version-2-cynthia-feedback
